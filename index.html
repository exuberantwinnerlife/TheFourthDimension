<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0d0c1f" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f3f4fb;--s:#fff;--s2:#e6e7f5;--tx:#14132b;--mu:#65638d;--ln:#14132b1c;--ac:#5a53ee;--ok:#0f9d58;--bad:#dc2650;--wr:#c2710c;--gl:#8b86ff66;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0c1f;--s:#171533;--s2:#222046;--tx:#f1f0ff;--mu:#9d9ac9;--ln:#ffffff1a;--ac:#8f8aff;--ok:#4ade80;--bad:#fb7185;--wr:#fbbf24;--gl:#6d66ff55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0c1f;--s:#171533;--s2:#222046;--tx:#f1f0ff;--mu:#9d9ac9;--ln:#ffffff1a;--ac:#8f8aff;--ok:#4ade80;--bad:#fb7185;--wr:#fbbf24;--gl:#6d66ff55;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:400 15px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:600px;margin:0 auto;padding:22px 18px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--ac)}
h1,h2,.big,.ctr b{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.02em}
h1{font-size:25px;line-height:1.1;color:var(--tx)}
.sub{margin:3px 0 0;color:var(--mu);font-size:13px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--s2);border-radius:99px}
.tabs button{flex:1;border:0;padding:9px;border-radius:99px;background:none;color:var(--mu);font:inherit;font-weight:700;cursor:pointer}
.tabs .on{background:var(--ac);color:var(--bg)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sec{margin-top:30px;padding-top:20px;border-top:1px solid var(--ln)}
.sec:first-of-type{border:0;margin-top:14px;padding:0}
.sec h2{font-size:20px;margin-bottom:10px}
.dial{position:relative;width:min(376px,100%);margin:6px auto 12px}
.dial svg{display:block;width:100%;filter:drop-shadow(0 0 14px var(--gl))}
.dial circle{fill:none;stroke-width:24}
.dial .tr{stroke:var(--s2)}
.dial line{stroke:var(--mu);stroke-width:1.2}
.dial .hand{stroke:var(--tx);stroke-width:3.5;stroke-linecap:round}
svg text{fill:var(--mu);font-size:11px;font-weight:700}
.ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ctr b{font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.ctr span{color:var(--mu);font-size:13px;margin-top:6px}
.an .sg{animation:d 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes d{from{stroke-dasharray:0 100}}
.an .bar i{animation:w 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes w{from{width:0}}
.pill{display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;margin:0 auto;padding:7px 7px 7px 14px;border-radius:99px;background:var(--s2);font-weight:700;font-size:13px}
.pill i{width:9px;height:9px;border-radius:50%;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
.pill button{border:0;border-radius:99px;padding:6px 14px;background:var(--tx);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
#tm{font-variant-numeric:tabular-nums}
.r{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:7px 0;align-items:center}
.r b{font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;border-radius:9px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ac)}
.r.p{grid-template-columns:1fr auto 36px}
.r .pc{color:var(--mu);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.r.p .bar i{min-width:4px}
.r.un span,.r.un b,.r.un .pc{color:var(--mu)}.r.un b{font-weight:500}
.r.un .bar i{background:repeating-linear-gradient(135deg,var(--mu) 0 1.6px,transparent 1.6px 5px);opacity:.5}
.g{padding:14px 0;border-top:1px solid var(--ln)}
.g:first-of-type{border:0;padding-top:4px}
.gh{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.gh small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.g .bar{margin:9px 0}
.g p{margin:0;color:var(--mu);font-size:14px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wr{color:var(--wr)}.mu{color:var(--mu)}
.dots{display:flex;align-items:center;gap:5px;margin-top:9px;font-size:12px;color:var(--mu)}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--mu)}
.dots .y{background:var(--ok);border-color:var(--ok)}.dots .n{border-color:var(--bad)}
.panel{background:var(--s);border:1px solid var(--ln);border-radius:22px;padding:16px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:1px solid var(--ln);background:var(--s2);color:var(--tx);border-radius:16px;padding:11px 2px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;display:grid;gap:3px;justify-items:center}
.chip span{font-size:22px}
.chip.on{outline:2px solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--s2))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
select,.btn{font:inherit;font-weight:700;color:var(--tx);background:var(--s2);border:1px solid var(--ln);border-radius:14px;padding:9px 11px}
.btn{cursor:pointer;background:var(--ac);color:var(--bg);border:0;padding:10px 18px}
.lnk{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;cursor:pointer;padding:0}
.lnk.bad{color:var(--bad)}
.demo{margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--s2);font-size:13px;color:var(--mu)}
.demo .lnk{display:inline-grid;white-space:nowrap}.demo .lnk span{grid-area:1/1;text-align:left}.demo .lnk span+span,.demo .lnk.bad span:first-child{visibility:hidden}.demo .lnk.bad span+span{visibility:visible}
.big{font-size:28px;line-height:1.15;margin-bottom:6px}
.strip{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:40px}.strip i{border-radius:4px}
.ax{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;margin-top:5px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mu);margin-top:10px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
footer{margin-top:34px;text-align:center;color:var(--mu);font-size:12px;line-height:1.8}
.tabs button{padding:9px 0;font-size:13.5px;white-space:nowrap}
.dur{margin-top:16px}
.seg{display:flex;gap:4px;padding:4px;background:var(--s2);border-radius:99px;margin-bottom:14px}
.seg button{flex:1;border:0;padding:8px;border-radius:99px;background:none;color:var(--mu);font:inherit;font-weight:700;cursor:pointer}
.seg .on{background:var(--tx);color:var(--bg)}
.chip{min-width:0;overflow-wrap:anywhere;line-height:1.2}.chip.nw{border-style:dashed;background:none}
.dur{display:flex;align-items:flex-start;justify-content:center;gap:8px}
.dur input{width:80px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);border-radius:18px;padding:8px 0;text-align:center;font:600 34px/1.1 Fraunces,Georgia,serif;-moz-appearance:textfield}
.dur input::-webkit-outer-spin-button,.dur input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dur small{display:block;text-align:center;color:var(--mu);font-size:12px;margin-top:4px}
.st{flex:none;width:44px;height:44px;margin-top:10px;border-radius:50%;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:600 22px/1 "DM Sans",sans-serif;cursor:pointer}
.qk{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.qk button{border:1px solid var(--ln);background:none;color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.sum{text-align:center;color:var(--mu);margin:10px 0 0;font-size:13px}
.btn.w{width:100%;margin-top:14px}.btn:disabled{opacity:.45;cursor:not-allowed}
.txt{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;width:100%}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.emo button{border:0;background:var(--s2);border-radius:12px;padding:6px 0;font-size:20px;cursor:pointer}
.emo .on,.sw .on{outline:2px solid var(--tx);outline-offset:1px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer}
.sw input{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.pv{display:inline-grid;gap:3px;justify-items:center;padding:12px 24px;border-radius:16px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--s2));font-weight:700;font-size:12px}
.pv span{font-size:28px}
.ico{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;margin-right:10px;font-size:18px}
.dur{align-items:flex-start;gap:10px;flex-wrap:wrap}
.dp{display:flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--ln);border-radius:22px;padding:4px}
.dg{display:grid;justify-items:center}
.dur input{width:48px;border:0;background:none;border-radius:0;padding:6px 0;font:600 30px/1.1 Fraunces,Georgia,serif}
.st{width:36px;height:36px;margin:0;border:0;background:var(--s);font-size:20px}
.sb{margin-left:20px;padding-left:12px;border-left:2px solid var(--ln)}
.ac{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:flex-end}
#intro{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);animation:out .22s ease 1.23s forwards}
#intro svg{width:min(460px,94vw);height:auto;overflow:visible}
#intro text{font:italic 600 15px Fraunces,Georgia,serif}
#intro .ti{font-style:normal;font-size:19px;fill:var(--tx)}
#intro .gr{--o:.3}#intro .gr line{stroke:var(--mu);stroke-width:.7}
#intro .dl{stroke:var(--mu);stroke-width:.8;stroke-dasharray:2 3;--o:.7}
#intro .fi{animation:ph .18s var(--d,0s) both}
#intro .dr{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .32s var(--d,0s) cubic-bezier(.3,.7,.2,1) both}
#intro .tj{stroke:#fbbf24;stroke-width:1.6;animation-duration:.45s}
@keyframes ph{from{opacity:0}to{opacity:var(--o,1)}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes out{to{opacity:0;visibility:hidden}}
:root{--gp:#fff;--tp:13%}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gp:#403d70;--tp:10%}}
:root[data-theme="dark"]{--gp:#403d70;--tp:10%}
.hi{display:grid;margin:0 0 4px}.hi b{font:600 29px/1.06 Newsreader,Georgia,serif;letter-spacing:-.015em}.hi span{color:var(--mu);font-size:14px}
.dial .id{fill:var(--s);stroke:var(--ln);stroke-width:1}
.dial .gp{stroke:var(--gp)}
.dial .hc{fill:var(--tx);stroke:none}
.dial .q{cursor:pointer}.dial .q circle{fill:transparent;stroke:none}
.dial .qm{fill:var(--tx);font:700 17px Fraunces,Georgia,serif}
.dial .yh{font:600 11.5px Caveat,"Comic Sans MS","Chalkboard SE",cursive;fill:var(--tx)}
.dial .ya{fill:none;stroke:var(--tx);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.ctr{display:grid;place-items:center;pointer-events:none}
.ctr b{font-size:clamp(24px,8.2vw,31px)}.ctr span{font-size:12px;line-height:1.25;margin-top:3px}
.ctr .hr{display:block;width:clamp(70px,22vw,92px);height:1px;background:var(--tx);margin:clamp(6px,1.9vw,11px) 0 clamp(7px,2vw,12px);opacity:.85}
.dial{container-type:inline-size;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dial line,.dial text,.dial .hc,.dial .yg{pointer-events:none}
.dial .sg{pointer-events:none;transition:opacity .2s,stroke-width .2s}
.dial .sgm{cursor:pointer;outline:none}
.dial .hit{fill:none;stroke:transparent;stroke-width:38;pointer-events:stroke;transition:stroke .15s}
.dial.pk .sgm:not(.sel) .sg{opacity:.27}
.dial .sgm.sel .sg,.dial .sgm:focus-visible .sg{stroke-width:30}
.dial .sgm:focus-visible .hit{stroke:var(--ac);stroke-opacity:.3}
@media(hover:hover){.dial .sgm:not(.sel):hover .sg{stroke-width:27}}
.dial .id{transition:fill .25s,stroke .25s}
.dial.pk .id{fill:color-mix(in srgb,var(--k) var(--tp),var(--s));stroke:color-mix(in srgb,var(--k) 62%,transparent);stroke-width:1.5}
.cmn,.cdt{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cmn{transition:opacity .2s,transform .25s,visibility 0s}
.pk .cmn{opacity:0;transform:scale(.93);visibility:hidden;transition:opacity .2s,transform .25s,visibility 0s .25s}
.cdt{opacity:0;visibility:hidden;transition:opacity .15s,visibility 0s .15s}
.pk .cdt{opacity:1;visibility:visible;transition:opacity .2s .04s}
.sc{display:flex;flex-direction:column;align-items:center;max-width:41cqw}
.sc.in{animation:cdin .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes cdin{from{opacity:0;transform:scale(.88) translateY(6px)}}
.sce{font-size:20px;font-size:clamp(15px,5.7cqw,22px);line-height:1;margin-bottom:.35em}
.scn{font:600 18px/1.12 Fraunces,Georgia,serif;font:600 clamp(15px,5.2cqw,20px)/1.12 Fraunces,Georgia,serif;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.scs{color:var(--mu);font-size:11px;font-size:clamp(10.5px,3.1cqw,12px);line-height:1.25;margin-top:2px}
.scb{display:block;width:22px;height:3px;border-radius:3px;background:var(--k);margin:7px 0 6px;margin:1.9cqw 0 1.6cqw}
.scd{font:600 28px/1 Fraunces,Georgia,serif;font:600 clamp(23px,8.5cqw,32px)/1 Fraunces,Georgia,serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.scr{color:var(--mu);font-size:11px;font-size:clamp(10.5px,3.1cqw,12px);line-height:1.2;margin-top:5px;white-space:nowrap}
.sca{position:relative;pointer-events:auto;margin-top:9px;border:0;border-radius:99px;padding:6px 13px;background:var(--ac);color:var(--bg);font:700 12px/1.1 "DM Sans",system-ui,sans-serif;font:700 clamp(10.5px,3.2cqw,12px)/1.1 "DM Sans",system-ui,sans-serif;padding:.5em 1.05em;cursor:pointer}
.sca::after{content:"";position:absolute;inset:-9px -6px}
.mys{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 10px;margin:14px 0 0;font-size:14px;color:var(--mu)}.mys b{color:var(--tx)}.mys .md{width:8px;height:8px;border-radius:50%;flex:none}.mys .wr{background:var(--wr)}.mys .ok{background:var(--ok)}
.bd{position:fixed;inset:0;z-index:90;background:#0a0818a6;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--s);border-radius:26px 26px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.bd.ani{animation:fade .2s both}.bd.ani.nf{animation:none}.bd.ani .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1) both}
.sheet h3{font:600 22px/1.2 Fraunces,Georgia,serif;margin:6px 0 0}
.grab{width:40px;height:4px;border-radius:9px;background:var(--ln);margin:0 auto 8px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.an .sec{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}.an .sec:nth-of-type(2){animation-delay:.06s}.an .sec:nth-of-type(3){animation-delay:.12s}.an .sec:nth-of-type(n+4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.le{padding:11px 0;border-top:1px solid var(--ln)}.le:first-of-type{border:0;padding-top:2px}
.l1{display:flex;justify-content:space-between;gap:10px;font-weight:500}.l1 b{font-variant-numeric:tabular-nums}
.l2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:1px;font-size:13px}.l2 .ac{flex:none;flex-wrap:nowrap;gap:4px 18px}
.pl{background:none;border:0;padding:7px 0;font:inherit;font-weight:500;color:var(--tx);cursor:pointer}.pl.bad{color:var(--bad)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.hd span{font:500 14px "DM Sans",system-ui,sans-serif;color:var(--mu)}
.nl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}.nl:first-of-type{border:0;padding-top:2px}.nl small{display:block;color:var(--mu);font-size:13px}
.add{flex:none;display:grid;place-items:center;width:38px;height:38px;padding:0;border-radius:50%;border:1.5px solid var(--ac);background:none;color:var(--ac);cursor:pointer}
.tp{justify-content:space-between;margin-top:16px}
.tp .txt{width:auto}
.tp label span{display:inline-block;min-width:2.4em;text-align:right}
.tp .txt,.qc .txt,#le{font-size:16px}
#lw+#lr{margin-top:2px}
.sum.em{font-weight:700}.sum.bad{color:var(--bad)}.sum.ok{color:var(--ok)}
.seg.sm{margin:18px 0 0}.seg.sm button{padding:7px;font-size:13px}
.sum:empty{display:none}
.qc{margin-top:12px;padding:14px;border-radius:18px;background:var(--bg);border:1.5px dashed var(--ac)}
.qh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;margin-bottom:10px}
.qr{display:flex;gap:10px;align-items:center}
.qi{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:14px;font-size:24px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--s2))}
.emo.x{display:flex;overflow-x:auto;gap:6px;padding:3px 3px 6px;scrollbar-width:none}.emo.x::-webkit-scrollbar{display:none}
.emo.x button{flex:none;width:40px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-reduced-motion:reduce){#intro{display:none}}
.beta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:14px;padding:9px 14px;border-radius:14px;border:1.5px dashed var(--ac);background:none;color:var(--ac);font:inherit;font-size:13.5px;font-weight:700;text-align:left;cursor:pointer}
.beta span{display:inline-flex;align-items:center;gap:8px}.beta small{color:var(--mu);font-weight:500;font-size:12px;white-space:nowrap}
.beta+.demo{margin-top:8px}
#tr .tour{position:fixed;inset:0;z-index:100;touch-action:none;overscroll-behavior:contain;-webkit-tap-highlight-color:transparent;animation:fade .3s ease both}
.t-hole{position:fixed;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%);border-radius:20px;pointer-events:none;box-shadow:0 0 0 100vmax rgba(9,8,26,.7);transition:width .34s cubic-bezier(.2,.8,.2,1),height .34s cubic-bezier(.2,.8,.2,1)}
.t-hole.snap{transition:none}
.t-hole::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:2px solid #fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 38%,transparent),0 0 26px var(--gl);transition:opacity .2s}
.t-hole.shut::after{opacity:0}

let h='';if(s.list)h+=`<ul class="t-list">${s.list.map(([e,a,t])=>`<li><i>${e}</i><span><b>${a}</b> ${t}</span></li>`).join('')}</ul>`;
if(s.n)h+=`<p class="t-note">${s.n}</p>`;if(s.end&&S.demo)h+=`<p class="t-sample">You're exploring a sample week. Tap Start fresh to track your own.</p>`;
q('.t-more').innerHTML=h;q('.t-dots').innerHTML=TS.map((_,k)=>`<i class="${k===i?'on':k<i?'dn':''}"></i>`).join('');
q('.t-next').textContent=s.go||'Next';q('.t-back').style.visibility=i?'visible':'hidden';c.classList.toggle('mid',!!s.c);c.classList.toggle('first',i===0)}
function tMount(){const d=document.createElement('div');d.className='tour';
d.innerHTML=`<div class="t-hole shut snap"></div><div class="t-card" role="dialog" aria-modal="true" aria-labelledby="t-ti" aria-describedby="t-bd"><i class="t-caret"></i><div class="t-top"><div class="t-dots" aria-hidden="true"></div><button class="t-skip" onclick="tourEnd()" aria-label="Skip the tutorial">Skip</button></div><svg class="t-mark" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="9" width="18" height="18" rx="2"/><rect x="13" y="3" width="18" height="18" rx="2"/><path d="M3 9l10-6M21 9l10-6M3 27l10-6M21 27l10-6"/></svg><div aria-live="polite"><span class="t-vh"></span><h3 class="t-title" id="t-ti"></h3><p class="t-body" id="t-bd"></p><div class="t-more"></div></div><div class="t-foot"><button class="lnk t-back" onclick="tourBack()">Back</button><button class="btn t-next" onclick="tourNext()">Next</button></div></div>`;
d.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});d.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
$('#tr').appendChild(d);TR.root=d;TR.hole=d.querySelector('.t-hole');TR.card=d.querySelector('.t-card')}
function tourGo(i,re){const s=TS[i];if(!s||!TR)return;const first=TR.i<0,id=++TR.n;TR.i=i;
const body=()=>{if(!TR||TR.n!==id)return;if(s.pre)s.pre();if(s.tab){tab=s.tab;QC=null;SG=null;render()}
tFill(s,i);if(!re)TR.card.classList.remove('in');TR.hh=null;let y=scrollY;const q=s.sel&&tRect(s);
if(q){const p=tPlan(q,TR.card.offsetHeight);TR.hh=p.hh;y=p.sy}else if(s.tab)y=0;
tPan(y,()=>{if(!TR||TR.n!==id)return;const q2=s.sel&&tRect(s),G=q2?tGeom(q2,s):null;TR.G=G;TR.s=s;tPlace(G);re?tSnap(G):tOpen(G);TR.card.classList.add('in');
if(!re){const nx=TR.card.querySelector('.t-next');if(nx)nx.focus({preventScroll:true})}})};
if(first||re)body();else{TR.card.classList.remove('in');tClose();setTimeout(body,230)}}
function tLoop(){if(!TR)return;TR.raf=requestAnimationFrame(tLoop);const s=TR.s;if(!s||!s.sel||TR.pan||!TR.G)return;const q=tRect(s);if(!q)return;const G=tGeom(q,s),o=TR.G;
if(Math.abs(G.x-o.x)+Math.abs(G.y-o.y)+Math.abs(G.w-o.w)+Math.abs(G.h-o.h)<1)return;
const v=tView();if(G.y<v.t-30||G.y+G.h>v.b+30){tReplan();return}TR.G=G;tSnap(G);tPlace(G)}
function tReplan(f){if(!TR||TR.pan)return;const t=Date.now();if(!f&&t-(TR.rp||0)<500)return;TR.rp=t;tourGo(TR.i,1)}
function tourNext(){if(!TR||TR.busy)return;TR.busy=1;setTimeout(()=>{if(TR)TR.busy=0},320);if(TR.i>=TS.length-1)tourEnd();else tourGo(TR.i+1)}
function tourBack(){if(!TR||TR.busy||TR.i<1)return;TR.busy=1;setTimeout(()=>{if(TR)TR.busy=0},320);tourGo(TR.i-1)}
function tourEnd(){if(!TR)return;const T=TR;TR=null;cancelAnimationFrame(T.raf);removeEventListener('resize',T.rs);clearTimeout(T.rt);T.root.remove();inert(0);$('.app').style.paddingBottom='';
tab=T.auto?'today':T.b.tab;QC=null;SG=null;render();scrollTo(0,T.auto?0:T.b.sy);lookOpen(1)}
function tourStart(auto){if(TR||TL)return;if(GS){GS=null;render()}QC=null;SG=null;TR={i:-1,n:0,auto:!!auto,b:{tab,sy:scrollY},hh:null,G:null,s:null,pan:0,busy:0};
if(auto)lsSet(SK,'1');$('.app').style.paddingBottom='calc(48px + 100vh)';tMount();inert(1);TR.rs=()=>{clearTimeout(TR.rt);TR.rt=setTimeout(()=>{if(TR)tReplan(1)},160)};addEventListener('resize',TR.rs);
TR.raf=requestAnimationFrame(tLoop);tourGo(0);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(TR)tReplan(1)})}
function tourKey(e){const k=e.key;if(k==='Escape'){e.preventDefault();tourEnd()}else if(k==='ArrowRight'){e.preventDefault();tourNext()}else if(k==='ArrowLeft'){e.preventDefault();tourBack()}
else if(k==='Tab'){const f=[...TR.card.querySelectorAll('button')].filter(b=>b.offsetParent!==null&&b.style.visibility!=='hidden');if(f.length){const i=f.indexOf(document.activeElement);e.preventDefault();f[e.shiftKey?(i<1?f.length-1:i-1):(i<0||i>=f.length-1?0:i+1)].focus()}}
else if(['PageUp','PageDown','Home','End'].includes(k)||(k===' '&&!(document.activeElement&&document.activeElement.matches('button'))))e.preventDefault()}
setInterval(tick,1000);
const busy=()=>{const e=document.activeElement;if(!e||!e.matches)return 0;if(e.matches('select,input'))return 1;try{return e.matches('.sgm:focus-visible')}catch(x){return 0}};
(function mt(){setTimeout(()=>{if(!GS&&!busy()&&!TR&&!TL)render();mt()},60030-Date.now()%60000)})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();idbBoot();
</script></body></html>
